[package]
name = "video-spike"
description = "M5 spike: capture/synthetic -> encode -> framing -> D3D11VA decode -> present with per-stage timings (ADR 0005)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
deskbridge-video = { workspace = true, features = ["ffmpeg"] }
deskbridge-platform.workspace = true
deskbridge-platform-windows.workspace = true
deskbridge-proto.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]
