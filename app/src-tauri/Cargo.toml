[package]
name = "desk-bridge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Desk Bridge UI: tray, windows and the pipe client to the agent"
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# TODO(updater): tauri-plugin-updater (2.13) requires zip ^4 and every zip 2.x/4.x release is yanked on
# crates.io (workspace resolution fails). Re-enable once a resolvable release exists: add
#   tauri-plugin-updater = { version = "2", optional = true }
# and change the feature below to `updater = ["dep:tauri-plugin-updater"]`.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
window-vibrancy = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
directories = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
sys-locale = "0.3"

[features]
# Off by default; see the TODO above. Only gates the code, the dependency is not declared yet.
updater = []
