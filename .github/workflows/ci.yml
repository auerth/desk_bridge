name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  checks:
    name: Checks (fmt, clippy, test, deny, audit)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks

      # windows-latest ships cmake (needed to build libopus). Fail early if that ever changes.
      - name: cmake available
        shell: pwsh
        run: cmake --version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The Tauri crate in the workspace embeds app/dist at compile time, so the web build has to
      # exist before clippy/test run.
      - name: Web UI build
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit

  installer:
    name: NSIS installer
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: installer

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: FFmpeg licence check (only when vendor/ffmpeg is present)
        id: ffmpeg
        shell: pwsh
        run: |
          if (Test-Path vendor/ffmpeg/bin) {
            ./scripts/check-ffmpeg-license.ps1
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "vendor/ffmpeg not present - skipping (no video pipeline in this build)."
            "present=false" >> $env:GITHUB_OUTPUT
          }

      # Builds agent/service/setup in release mode and copies them (plus drivers and FFmpeg DLLs
      # when present) to installer/stage/, which bundle.resources in tauri.conf.json points at.
      - name: Stage installer payload
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ steps.ffmpeg.outputs.present }}' -ne 'true') { $extra += '-NoFfmpeg' }
          ./scripts/stage-installer.ps1 @extra

      # Assumes @tauri-apps/cli is a devDependency of app/ and package.json has
      # "tauri": "tauri" (it does). PR builds have no updater signing key, so updater artefacts are
      # switched off through a config overlay.
      - name: Tauri build (NSIS)
        working-directory: app
        shell: pwsh
        run: |
          $overlay = Join-Path $env:RUNNER_TEMP 'tauri-ci.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding ascii $overlay
          npm ci
          npm run tauri build -- --ci --bundles nsis --config $overlay

      - name: Name the installer
        id: pack
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $setup = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer not found under target/release/bundle/nsis' }
          $out = "DeskBridge-Setup-$ver.exe"
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          Copy-Item $setup.FullName "dist-installer/$out"
          Get-FileHash "dist-installer/$out" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $out" } | Set-Content -Encoding ascii "dist-installer/$out.sha256"
          "name=$out" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: dist-installer/*
          if-no-files-found: error
          retention-days: 14
