name: Release

# Push a tag like v0.2.0 (or v0.2.0-rc.1) to build the installer, publish a GitHub Release and
# generate latest.json for the Tauri updater.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           content (or path) of the minisign private key created with
#                                       `npm run tauri signer generate -- -w ~/.tauri/deskbridge.key`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty string if none)
# The matching PUBLIC key goes into app/src-tauri/tauri.conf.json -> plugins.updater.pubkey.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check the tag matches the crate version
        id: ver
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "$env:TAG".TrimStart('v')
          if ($tag -ne $ver) { throw "Tag $env:TAG does not match workspace version $ver" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: FFmpeg licence check (only when vendor/ffmpeg is present)
        id: ffmpeg
        shell: pwsh
        run: |
          if (Test-Path vendor/ffmpeg/bin) {
            ./scripts/check-ffmpeg-license.ps1
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
          }

      - name: Stage installer payload
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ steps.ffmpeg.outputs.present }}' -ne 'true') { $extra += '-NoFfmpeg' }
          ./scripts/stage-installer.ps1 @extra

      - name: Tauri build (NSIS, signed updater artefacts)
        working-directory: app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Secret TAURI_SIGNING_PRIVATE_KEY is not set.' }
          $overlay = Join-Path $env:RUNNER_TEMP 'tauri-release.json'
          '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content -Encoding ascii $overlay
          npm ci
          npm run tauri build -- --ci --bundles nsis --config $overlay

      - name: Collect assets and write latest.json
        id: pack
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $nsis = 'target/release/bundle/nsis'
          $setup = Get-ChildItem $nsis -Filter *-setup.exe | Select-Object -First 1
          $sig = Get-Item "$($setup.FullName).sig" -ErrorAction Stop
          $name = "DeskBridge-Setup-$ver.exe"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $setup.FullName "release/$name"
          Copy-Item $sig.FullName "release/$name.sig"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -Encoding ascii "release/$name.sha256"

          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$name"
          $manifest = [ordered]@{
            version  = $ver
            notes    = "Desk Bridge $ver - see https://github.com/${{ github.repository }}/releases/tag/$env:TAG"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url       = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 release/latest.json
          Get-Content release/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Desk Bridge ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            release/*
          fail_on_unmatched_files: true
