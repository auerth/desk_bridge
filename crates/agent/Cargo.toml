[package]
name = "deskbridge-agent"
description = "Desk Bridge agent: the elevated background process that does the actual work"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "deskbridge-agent"
path = "src/main.rs"

[dependencies]
deskbridge-core = { path = "../core" }
deskbridge-platform.workspace = true
deskbridge-video = { workspace = true, features = ["ffmpeg"] }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
deskbridge-platform-windows.workspace = true
deskbridge-service = { path = "../service" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
parking_lot = "0.12"
